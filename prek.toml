# Configuration for prek, the repository's Git hook runner.
# See https://prek.j178.dev for configuration details.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "codex-config-policy", name = "Validate Codex MCP credential policy", entry = "mise exec --no-deps python@3.13 -- python bin/codex-config check --config codex/config.toml --policy codex/policy.toml", language = "system", pass_filenames = false, files = "^(bin/codex-config|codex/.*\\.toml|tests/codex_config_test\\.py|tests/fixtures/codex-config/.*\\.toml)$" },
  { id = "gitleaks", name = "Detect hardcoded secrets", entry = "mise exec --no-deps gitleaks@8.30.1 -- gitleaks git --pre-commit --redact --staged --verbose", language = "system", pass_filenames = false, always_run = true },
]
