[env]
UV_PYTHON_PREFERENCE = "only-system"
UV_PYTHON_DOWNLOADS  = "never"
MISE_NPM_PACKAGE_MANAGER = "npm"

[env._]
path = '["/Users/lcatlett/.local/bin/agentsview"]'

[settings]
python.uv_venv_auto = "source"
experimental = true
lockfile = false


[settings.ruby]
compile = false

[settings.pipx]
uvx = true


